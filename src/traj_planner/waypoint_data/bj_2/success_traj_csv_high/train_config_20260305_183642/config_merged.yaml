task:
  name: wire_swing_bj
  env_cls: RL.envs.wire_swing_bj_env.WireSwingBallJointEnv
  num_envs: 8
  env_spacing: 3.0
  phys_dt: 0.002
  num_substeps: 1
  max_steps: 500
  init_warmup_steps: 20
  num_robot_dofs: 6
  end_effector_link: wrist_3_link
  active_joints:
  - 1
  - 2
  - 3
  default_joint_positions:
  - -1.5935
  - -2.2756
  - -1.1913
  - -0.3241
  - 1.5707
  - 3.1415
  robot_offset:
  - 0.0
  - 0.0
  - 1.7
  robot_orient_xyz_deg:
  - -90.0
  - 0.0
  - 0.0
  target_local:
  - 0.0
  - 2.0
  - 2.3
  stick_length: 0.65
  stick_radius: 0.01
  wire_base_length: 1.0
  wire_n_elem: 20
  wire_base_radius: 0.00635
  bj_joint_damping: 5.0
  bj_joint_stiffness: 0.0
  bj_joint_drive_type: force
  bj_link_linear_damping: 0.6
  bj_link_angular_damping: 1.2
  bj_mat_static_friction: 0.6
  bj_mat_dynamic_friction: 0.5
  bj_mat_restitution: 0.0
  bj_collision_rest_offset: 0.0
  bj_collision_contact_offset: 0.002
  bj_link_density: 600.0
  joint_pos_lower_limits:
  - -6.28
  - -6.28
  - -6.28
  - -6.28
  - -6.28
  - -6.28
  joint_pos_upper_limits:
  - 6.28
  - -1.92
  - -0.44
  - 6.28
  - 6.28
  - 6.28
  joint_vel_limits:
  - 1.5708
  - 1.5708
  - 1.5708
  - 1.5708
  - 1.5708
  - 1.5708
  joint_delta_scale: 3.0
  positive_only_active_joints: true
  success_thresh: 0.05
  touch_thresh: 0.03
  too_far_thresh: 4.0
  reward_clip_min: -10.0
  reward_clip_max: 200.0
  action_penalty: 0.05
  smooth_penalty: 0.02
  w_proximity: 1.0
  w_progress: 10.0
  w_new_best: 30.0
  w_tip_velocity_toward_target: 1.0
  w_joint3_velocity: 0.5
  joint3_reward_index: 3
  joint3_velocity_abs: false
  w_time_penalty: 0.05
  success_bonus: 50.0
  bonus_thresh_1: 0.5
  bonus_thresh_2: 0.2
  bonus_thresh_3: 0.1
  bonus_thresh_4: 0.05
  bonus_value_1: 1.0
  bonus_value_2: 3.0
  bonus_value_3: 5.0
  bonus_value_4: 10.0
  touch_bonus: 50.0
  swing_done_enabled: false
  swing_grace_steps: 300
  swing_fallback_steps: 400
  terminate_on_success: true
  sync_reset_ratio: 2.0
  enable_wire_visual: false
algo:
  name: ppo
  lr: 0.0003
  gamma: 0.99
  eps_clip: 0.2
  k_epochs: 4
  rollout_len: 64
  entropy_coef: 0.01
  vf_coef: 0.5
  grad_clip: 0.5
  action_std: 0.5
seed: 0
device: cuda
total_steps: 200000
log_every: 10000
log_episode_metrics: true
episode_log_every: 1
episode_log_avg_window: 10
render: false
save_checkpoints: true
checkpoint_every: 5000
checkpoint_dir: checkpoints
save_final_checkpoint: true
resume_checkpoint: ''
export_success_actions: true
save_configs_to_success_dir: true
success_export_limit: 20
success_export_dir: data/wire_swing_bj_2/success_traj_csv_high
success_export_prefix: success_episode
wandb:
  enabled: true
  project: cosseratx-rl
  entity: ''
  run_name: ''
  mode: online
  notes: ''
  tags: []
  dir: wandb
eval:
  checkpoint: ''
  deterministic: true
  episodes: 5
  max_total_steps: 0
  export_dir: eval_exports
  export_prefix: eval
  export_mode: best_success
  export_joint_csv: true
  export_actions_npz: true
  export_episode_summary: true
  export_summary_json: true
  resample_dt: 0.0
